```html
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wishlist | Jloodna</title>

<link rel="stylesheet" href="wishlist.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>

:root{
  --primary:#071220;
  --secondary:#10243D;
  --accent:#E8C97A;
  --white:#ffffff;
  --gray:#6B7280;
  --light:#F3F4F6;
  --danger:#E63946;
  --success:#10B981;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'DM Sans',sans-serif;
  background:#F8FAFC;
  color:#111827;
}

a{
  text-decoration:none;
  color:inherit;
}

img{
  width:100%;
  display:block;
}

/* ===========================
HEADER
=========================== */

.header{
  background:var(--primary);
  color:white;
  padding:16px 7%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  font-size:1.6rem;
  font-weight:700;
  color:var(--accent);
}

.header-actions{
  display:flex;
  align-items:center;
  gap:14px;
}

.header-btn{
  position:relative;
  width:42px;
  height:42px;
  border-radius:12px;
  background:rgba(255,255,255,.08);
  border:none;
  color:white;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:.3s;
}

.header-btn:hover{
  background:rgba(255,255,255,.16);
}

.badge{
  position:absolute;
  top:-5px;
  right:-5px;
  background:var(--danger);
  color:white;
  width:20px;
  height:20px;
  border-radius:50%;
  font-size:.7rem;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
}

/* ===========================
PAGE TITLE
=========================== */

.page-title{
  padding:50px 7% 20px;
}

.page-title h1{
  font-size:2.6rem;
  color:var(--primary);
}

.page-title p{
  color:var(--gray);
  margin-top:8px;
}

/* ===========================
WISHLIST GRID
=========================== */

.wishlist-container{
  padding:20px 7% 80px;
}

.wishlist-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:28px;
}

.product-card{
  background:white;
  border-radius:24px;
  overflow:hidden;
  position:relative;
  box-shadow:0 10px 35px rgba(0,0,0,.05);
  transition:.3s;
}

.product-card:hover{
  transform:translateY(-8px);
}

.product-image{
  background:#F9FAFB;
  padding:30px;
  position:relative;
}

.product-image img{
  height:220px;
  object-fit:contain;
}

.remove-btn{
  position:absolute;
  top:16px;
  right:16px;
  width:42px;
  height:42px;
  border:none;
  border-radius:50%;
  background:white;
  color:var(--danger);
  cursor:pointer;
  font-size:1rem;
  box-shadow:0 6px 20px rgba(0,0,0,.08);
  transition:.3s;
}

.remove-btn:hover{
  background:var(--danger);
  color:white;
}

.product-info{
  padding:24px;
}

.product-category{
  color:var(--accent);
  font-size:.8rem;
  font-weight:700;
  text-transform:uppercase;
}

.product-title{
  font-size:1.1rem;
  margin:10px 0;
  color:var(--primary);
}

.product-rating{
  color:#F59E0B;
  margin-bottom:14px;
}

.product-price{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:20px;
}

.new-price{
  font-size:1.3rem;
  font-weight:700;
  color:var(--primary);
}

.old-price{
  text-decoration:line-through;
  color:#9CA3AF;
}

.product-actions{
  display:flex;
  gap:12px;
}

.cart-btn{
  flex:1;
  border:none;
  border-radius:14px;
  background:var(--primary);
  color:white;
  padding:14px;
  font-weight:700;
  cursor:pointer;
  transition:.3s;
}

.cart-btn:hover{
  background:var(--accent);
  color:var(--primary);
}

.buy-btn{
  width:54px;
  border:none;
  border-radius:14px;
  background:var(--accent);
  color:var(--primary);
  cursor:pointer;
  font-size:1rem;
  font-weight:700;
}

/* ===========================
EMPTY STATE
=========================== */

.empty-state{
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:120px 20px;
  text-align:center;
}

.empty-state img{
  width:220px;
  margin-bottom:30px;
}

.empty-state h2{
  color:var(--primary);
  margin-bottom:12px;
}

.empty-state p{
  color:var(--gray);
  margin-bottom:24px;
}

.shop-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:14px 28px;
  border-radius:14px;
  background:var(--accent);
  color:var(--primary);
  font-weight:700;
}

/* ===========================
REALTIME STATUS
=========================== */

.realtime-bar{
  position:fixed;
  bottom:20px;
  right:20px;
  background:white;
  border-radius:16px;
  padding:14px 18px;
  box-shadow:0 10px 35px rgba(0,0,0,.08);
  display:flex;
  align-items:center;
  gap:12px;
  z-index:999;
}

.live-dot{
  width:10px;
  height:10px;
  border-radius:50%;
  background:var(--success);
  animation:pulse 1.5s infinite;
}

@keyframes pulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.5);}
  100%{transform:scale(1);}
}

/* ===========================
RESPONSIVE
=========================== */

@media(max-width:768px){

  .header{
    padding:16px 5%;
  }

  .page-title{
    padding:40px 5% 20px;
  }

  .wishlist-container{
    padding:20px 5% 80px;
  }

  .page-title h1{
    font-size:2rem;
  }

}

</style>

</head>

<body>

<!-- ===========================
HEADER
=========================== -->

<header class="header">

  <a href="index.html" class="logo">
    Jloodna
  </a>

  <div class="header-actions">

    <button class="header-btn">
      🛒
      <span class="badge" id="cartCount">0</span>
    </button>

    <button class="header-btn">
      ❤
      <span class="badge" id="wishlistCount">0</span>
    </button>

  </div>

</header>

<!-- ===========================
TITLE
=========================== -->

<section class="page-title">

  <h1>Ma Wishlist</h1>

  <p>
    Tous vos produits favoris synchronisés en temps réel.
  </p>

</section>

<!-- ===========================
WISHLIST
=========================== -->

<section class="wishlist-container">

  <div class="wishlist-grid" id="wishlistGrid"></div>

  <!-- EMPTY -->

  <div class="empty-state" id="emptyState">

    <img src="https://cdn-icons-png.flaticon.com/512/2038/2038854.png">

    <h2>Votre wishlist est vide</h2>

    <p>
      Ajoutez vos produits préférés pour les retrouver ici.
    </p>

    <a href="shop.html" class="shop-btn">
      Découvrir les produits
    </a>

  </div>

</section>

<!-- ===========================
REALTIME STATUS
=========================== -->

<div class="realtime-bar">

  <div class="live-dot"></div>

  <span>
    Synchronisation temps réel active
  </span>

</div>

<!-- ===========================
JAVASCRIPT
=========================== -->

<script>

const wishlistGrid = document.getElementById("wishlistGrid");
const emptyState = document.getElementById("emptyState");
const wishlistCount = document.getElementById("wishlistCount");
const cartCount = document.getElementById("cartCount");

let wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];
let cart = JSON.parse(localStorage.getItem("cart")) || [];

function renderWishlist(){

  wishlistGrid.innerHTML = "";

  wishlistCount.textContent = wishlist.length;
  cartCount.textContent = cart.length;

  if(wishlist.length === 0){
    emptyState.style.display = "flex";
    return;
  }

  emptyState.style.display = "none";

  wishlist.forEach((product,index)=>{

    wishlistGrid.innerHTML += `

      <div class="product-card">

        <div class="product-image">

          <button class="remove-btn"
          onclick="removeWishlist(${index})">
            ✕
          </button>

          <img src="${product.image}" alt="">

        </div>

        <div class="product-info">

          <div class="product-category">
            ${product.category}
          </div>

          <h3 class="product-title">
            ${product.name}
          </h3>

          <div class="product-rating">
            ★★★★★
          </div>

          <div class="product-price">

            <span class="new-price">
              ${product.price}
            </span>

            <span class="old-price">
              ${product.oldPrice || ""}
            </span>

          </div>

          <div class="product-actions">

            <button class="cart-btn"
            onclick="addToCart(${index})">
              Ajouter au panier
            </button>

            <button class="buy-btn">
              ⚡
            </button>

          </div>

        </div>

      </div>

    `;

  });

}

function removeWishlist(index){

  wishlist.splice(index,1);

  localStorage.setItem(
    "wishlist",
    JSON.stringify(wishlist)
  );

  renderWishlist();

}

function addToCart(index){

  cart.push(wishlist[index]);

  localStorage.setItem(
    "cart",
    JSON.stringify(cart)
  );

  cartCount.textContent = cart.length;

  alert("Produit ajouté au panier");

}

window.addEventListener("storage",()=>{

  wishlist = JSON.parse(
    localStorage.getItem("wishlist")
  ) || [];

  cart = JSON.parse(
    localStorage.getItem("cart")
  ) || [];

  renderWishlist();

});

renderWishlist();

</script>

</body>
</html>
```
